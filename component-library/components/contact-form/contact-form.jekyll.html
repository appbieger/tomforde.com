<!-- begin contact -->
{% assign c = "c-contact-form" %}
<div class="{{c}}" id="contact">
  <div class="container">
    <div class="row">
      <div class="col col-12">

        <div class="{{c}}__form-box">
          <div class="{{c}}__contact-head">
            <h2 class="{{c}}__contact-title">{{ include.form_title }}</h2>
            <p class="{{c}}__contact-description">{{ include.form_description }}</p>
          </div>
          
          <!-- Success Message -->
          <div class="{{c}}__form-success" id="form-success" style="display: none;">
            <div class="{{c}}__form-success-box">
              <h3 class="{{c}}__form-success-title">✓ Nachricht erfolgreich gesendet!</h3>
              <p class="{{c}}__form-success-message">Vielen Dank für deine Nachricht. Ich melde mich so bald wie möglich bei dir!</p>
            </div>
          </div>
          
          <form class="{{c}}__form"
            action="https://formspree.io/f/mqaynpdd"
            method="POST"
            id="contact-form">
            
            <!-- Formspree Configuration -->
            <input type="hidden" name="_subject" value="Neue Kontaktanfrage von tomforde.com">
            <input type="hidden" name="_next" value="https://tomforde.com/contact/?success=true">
            
            <!-- Honeypot Spam Protection -->
            <input type="text" name="_gotcha" style="display:none">
            
            <div class="{{c}}__form-group">
              <label class="{{c}}__form-label screen-reader-text" for="form-name">Dein Name</label>
              <input class="{{c}}__form-input" id="form-name" type="text" name="name" placeholder="Dein Name..." required>
            </div>
            <div class="{{c}}__form-group">
              <label class="{{c}}__form-label screen-reader-text" for="form-email">Deine E-Mail</label>
              <input class="{{c}}__form-input" id="form-email" type="email" name="email" placeholder="Deine E-Mail..."
                required>
            </div>
            <div class="{{c}}__form-group">
              <label class="{{c}}__form-label screen-reader-text" for="form-message">Deine Nachricht</label>
              <textarea class="{{c}}__form-input" id="form-message" name="message" rows="9" placeholder="Deine Nachricht..."
                required></textarea>
            </div>
            <div class="{{c}}__form-group {{c}}__form-group--button">
              <button class="c-button c-button--primary c-button--large" type="submit">{{ include.form_button_text }}</button>
            </div>
          </form>
          
          <!-- Display success message if redirected back with ?success=true -->
          <script>
            // Check for success parameter in URL
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
              document.getElementById('form-success').style.display = 'block';
              document.getElementById('contact-form').style.display = 'none';
              // Remove success parameter from URL
              window.history.replaceState({}, document.title, window.location.pathname);
            }
          </script>
        </div>

      </div>
    </div>
  </div>
</div>
<!-- end contact -->

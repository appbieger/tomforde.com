<!DOCTYPE html>
<html lang="de">

{% include head.html %}

<body>

    {% if site.data.general_settings.google-analytics %}
        {% include google-analytics.html %}
    {% endif %}

    {% include header.html %}

    {{ content }}

    <!--
        Bookshop components are accessed using the bookshop tag,
        using the same syntax as the standard Jekyll include tag.
    -->
    {% bookshop_include page content_blocks=page.content_blocks page_theme=page.page_theme %}

    <div class="top" title="Top"><i class="ion ion-ios-arrow-up"></i></div>

    {% include footer.html %}

    <script src="/js/scripts.js"></script>
    <script src="/js/common.js"></script>
    <!-- PhotoSwipe JS + Init -->
    <script type="module">
      import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5/dist/photoswipe-lightbox.esm.min.js';
      import PhotoSwipe from 'https://unpkg.com/photoswipe@5/dist/photoswipe.esm.min.js';
      import PhotoSwipeDynamicCaption from 'https://unpkg.com/photoswipe-dynamic-caption-plugin/photoswipe-dynamic-caption-plugin.esm.js';

      const lightbox = new PhotoSwipeLightbox({
        gallery: '[data-pswp-gallery]',
        children: 'a[href]',
        pswpModule: PhotoSwipe,
      });

      // Dynamic captions: zeigt nur .pswp-caption-content an, kein Fallback auf alt-Attribut
      const captionPlugin = new PhotoSwipeDynamicCaption(lightbox, {
        captionContent: (slide) => {
          const captionEl = slide.data.element.querySelector('.pswp-caption-content');
          return captionEl ? captionEl.innerHTML : '';
        }
      });

      lightbox.init();
    </script>
    
</body>
</html>

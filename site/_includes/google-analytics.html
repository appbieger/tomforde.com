<!-- Google Analytics 4 (GA4) - DSGVO-konform -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.data.general_settings.google-analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());

  // GA4 Konfiguration mit DSGVO-konformen Einstellungen
  gtag('config', '{{ site.data.general_settings.google-analytics }}', {
    'anonymize_ip': true,                    // IP-Anonymisierung
    'cookie_flags': 'SameSite=None;Secure',  // Cookie-Sicherheit
    'cookie_expires': 63072000,              // Cookie-Ablauf: 2 Jahre (Standard)
  });

  // Opt-out Funktion für Datenschutz
  var gaProperty = '{{ site.data.general_settings.google-analytics }}';
  var disableStr = 'ga-disable-' + gaProperty;
  
  if (document.cookie.indexOf(disableStr + '=true') > -1) {
    window[disableStr] = true;
  }
  
  function gaOptout() {
    document.cookie = disableStr + '=true; expires=Thu, 31 Dec 2099 23:59:59 UTC; path=/';
    window[disableStr] = true;
    alert('Google Analytics wurde deaktiviert.');
  }
</script>

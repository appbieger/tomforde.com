stella:
  "00_Bauernhaus": "Das alte Bauernhaus der Großeltern – Ein Ort voller Geschichte und Erinnerungen, bevor der Umbau begann."
  "01_Bauernhaus_Entkernt": "Das entkernte Bauernhaus – Der erste Schritt zum Neuanfang. Die alten Strukturen weichen dem Neuen."
  "02_Abriss": "Abriss der alten Strukturen – Manchmal muss man loslassen, um Raum für Neues zu schaffen."
  "03_Baustellenromatik": "Baustellenromantik – In jedem Chaos liegt der Beginn von etwas Besonderem."
  "04_STELLA_Bodenplatte_2024": "Die Bodenplatte von STELLA – Das Fundament für ein neues Zuhause wird gegossen. Der Grundstein ist gelegt."
  "06_Rohbau_01": "Die ersten Wände erheben sich. Das Haus nimmt Gestalt an."
  "07_Rohbau_02": "Holzrahmenweise ermöglicht schnellen Fortschritt und Flexibilität bei der Umsetzung."
  "08_Rohbau_03": "Das Dach schließt sich. STELLA bekommt Schutz und Charakter."




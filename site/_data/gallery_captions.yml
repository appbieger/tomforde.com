stella:
  "00_Bauernhaus": "Das alte Bauernhaus der Großeltern – Ein Ort voller Geschichte und Erinnerungen, bevor der Umbau begann."
  "01_Bauernhaus_Entkernt": "Das entkernte Bauernhaus – Der erste Schritt zum Neuanfang. Die alten Strukturen weichen dem Neuen."
  "02_Abriss": "Abriss der alten Strukturen – Manchmal muss man loslassen, um Raum für Neues zu schaffen."
  "03_Baustellenromatik": "Baustellenromantik – In jedem Chaos liegt der Beginn von etwas Besonderem."
  "04_STELLA_Bodenplatte_2024": "Die Bodenplatte von STELLA – Das Fundament für ein neues Zuhause wird gegossen. Der Grundstein ist gelegt."
  "06_Rohbau_01": "Die ersten Wände erheben sich. Das Haus nimmt Gestalt an."
  "07_Rohbau_02": "Holzrahmenweise ermöglicht schnellen Fortschritt und Flexibilität bei der Umsetzung."
  "08_Rohbau_03": "Das Dach schließt sich. STELLA bekommt Schutz und Charakter."




luna:
  "010_Luna_Erste_Tage": "Die ersten Tage im Februar 2026 – frisch eingezogen. Der beste Platz im Haus ist erst mal der unter dem Tisch."
  "020_Luna_Kofferraum": "Der Kofferraum wird zum zweiten Zuhause. Von Anfang an überall mit dabei."
  "030_Luna_Schlafend": "Neue Eindrücke machen müde. Zwischen zwei Abenteuern wird geschlafen, wo gerade Platz ist."
  "040_Luna_Vor_STELLA": "Vor STELLA – der Rohbau im Rücken, Laub unter den Pfoten. Hier wächst sie auf."
  "050_Luna_Profil_Wiese": "Februarsonne, Windrad am Horizont – die ersten eigenen Runden über den Hof."
  "060_Luna_Stockjagd": "Der erste richtig große Stock. Deutlich länger als der Hund, aber das war noch nie ein Argument."
  "070_Luna_Am_Wasser": "Erste Begegnung mit dem Wasser. Interessant – aber vorerst aus sicherer Entfernung."
  "080_Luna_Strand_Sprung": "Volle Fahrt über den Sand. Ohren auf Durchzug, Bremsweg unbekannt."
  "090_Luna_Strand_Gegenlicht": "Weite, Wind und Sand bis zum Horizont. Strandtage sind Lieblingstage."
  "100_Luna_Hundekissen": "Ein eigener Platz im Haus. Aus dem Welpen wird langsam ein Hund."
  "110_Luna_Sandnase": "Baustelle heißt buddeln. Die Nase ist der wichtigste Bauhelfer – und sieht hinterher entsprechend aus."
  "120_Luna_Stephan_Wald": "Zu zweit unterwegs. Der Blick geht meistens in dieselbe Richtung."
  "130_Luna_Eisbaer_Blickkontakt": "Zoo am Meer, Auge in Auge mit einem Eisbären. Glasscheibe dazwischen, versteht sich."
  "140_Luna_Eisbaer_Stolz": "Kurz zuvor hat sie ihn angeknurrt – und er ist tatsächlich abgehauen. Den Stolz sieht man ihr an."
  "150_Luna_Mayla": "Luna und Mayla. Von den richtigen Hunden lernt man am meisten."
  "160_Luna_Wiese_STELLA": "Gewitterluft über dem Hof, STELLA im Hintergrund – und im Gras gibt es Wichtigeres zu untersuchen."
  "170_Luna_Wohnzimmer": "Angekommen. Der neue Teppich im Wohnzimmer ist selbstverständlich ihrer."
